parameters:
  - $ref: ../params/uuid.yaml

get:
  summary: Get subscription data for a uuid
  operationId: GetSubscriptionByUuid
  tags:
    - Subscription
  responses:
    '200':
      description: Subscription information successfully retrieved
      content:
        application/json:
          schema:
            $ref: ../components/subscription.yaml
    '404':
      description: Subscription data for specified uuid not found
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    '400':
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ../components/errors/bad_request_error.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/errors/internal_server_error.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/errors/generic_error.yaml

