version: '3'

vars:
  GO_VERSION: '1.24'
  GOLANGCI_LINT_VERSION: 'v2.1.5'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'
  BUF_VERSION: '1.53.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.6'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.5.1'
  OGEN_VERSION: 'v1.12.0'
  YQ_VERSION: 'v4.45.2'
  GRPCURL_VERSION: 'v1.9.3'
  MOCKERY_VERSION: 'v2.53.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  # на Windows buf берём из PATH (установлен через Scoop)
  BUF: 'buf'
  OGEN: '{{.BIN_DIR}}/ogen'
  YQ: '{{.BIN_DIR}}/yq'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go.exe'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc.exe'
  GRPCURL: '{{.BIN_DIR}}/grpcurl'
  MOCKERY: "{{.BIN_DIR}}/mockery"

  NODE_MODULES_DIR: '{{.ROOT_DIR}}/node_modules/.bin'
  REDOCLY: '{{.NODE_MODULES_DIR}}/redocly'

  OPEN_API_SUBSCRIPTION_V1_BASE: '{{.ROOT_DIR}}/shared/api/subscription/v1/subscription.openapi.yaml'
  OPEN_API_SUBSCRIPTION_V1_BUNDLE: '{{.ROOT_DIR}}/shared/api/bundles/subscription.openapi.v1.bundle.yaml'
  OPEN_API_FILES: '{{.ROOT_DIR}}/shared/api/bundles'

  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: total.out

  GRPC_SERVER_ADDR: 'localhost:50051'

  MODULES: subscription payment catalog shared

tasks:
  # ──────────────────────────────────────────────
  # УСТАНОВКА ИНСТРУМЕНТОВ
  # ──────────────────────────────────────────────

  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  # buf на Windows — через Scoop, не через curl+tar
  install-buf:
    desc: "Устанавливает Buf через Scoop (Windows)"
    cmds:
      - scoop install buf
    status:
      - buf --version

  proto:install-plugins:
    desc: "Устанавливает protoc плагины в каталог bin"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}

  ogen:install:
    desc: "Скачивает ogen в папку bin"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}

  yq:install:
    desc: "Устанавливает yq в bin/"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/mikefarah/yq/v4@{{.YQ_VERSION}}

  grpcurl:install:
    desc: "Устанавливает grpcurl в каталог bin"
    cmds:
      - |
        [ -f {{.GRPCURL}} ] || {
          echo '📦 Устанавливаем grpcurl {{.GRPCURL_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/fullstorydev/grpcurl/cmd/grpcurl@{{.GRPCURL_VERSION}}
        }
    status:
      - test -x {{.GRPCURL}}

  # ──────────────────────────────────────────────
  # ГЕНЕРАЦИЯ PROTO — без buf registry
  # ──────────────────────────────────────────────

  proto:gen:
    desc: Генерация Go-кода из .proto через protoc напрямую (без buf registry)
    deps: [ proto:install-plugins ]
    vars:
      # полный путь к плагинам с .exe для Windows
      GOBIN:
        sh: go env GOPATH
    cmds:
      - mkdir -p shared/pkg/proto/payment/v1
      - mkdir -p shared/pkg/proto/catalog/v1
      - >-
        protoc
        --plugin=protoc-gen-go={{.PROTOC_GEN_GO}}
        --plugin=protoc-gen-go-grpc={{.PROTOC_GEN_GO_GRPC}}
        --proto_path=shared/proto
        --go_out=shared/pkg/proto
        --go_opt=paths=source_relative
        --go-grpc_out=shared/pkg/proto
        --go-grpc_opt=paths=source_relative
        shared/proto/payment/v1/payment.proto
        shared/proto/catalog/v1/catalog.proto

  proto:lint:
    desc: Проверка .proto файлов (только синтаксис, без buf registry)
    deps: [ install-buf ]
    dir: shared/proto
    cmds:
      - buf lint

  # ──────────────────────────────────────────────
  # ГЕНЕРАЦИЯ OPENAPI
  # ──────────────────────────────────────────────

  redocly-cli:install:
    desc: Установить Redocly CLI
    cmds:
      - |
        [ -f {{.REDOCLY}} ] || {
          npm ci
        } || {
          echo "📦 Устанавливаем redocly-cli..."
          npm install
        }

  redocly-cli:subscription-v1-bundle:
    desc: Собрать OpenAPI подписки в один файл
    deps: [ redocly-cli:install ]
    cmds:
      - mkdir -p shared/api/bundles
      - '{{.REDOCLY}} bundle {{.OPEN_API_SUBSCRIPTION_V1_BASE}} -o {{.OPEN_API_SUBSCRIPTION_V1_BUNDLE}}'

  redocly-cli:bundle:
    desc: Собрать все OpenAPI схемы
    cmds:
      - task: redocly-cli:subscription-v1-bundle

  ogen:gen:
    desc: "Генерация Go-кода из OpenAPI"
    deps: [ ogen:install, yq:install ]
    cmds:
      - task: redocly-cli:bundle
      - mkdir -p shared/pkg/openapi/subscription/v1
      - >-
        {{.OGEN}}
        --target shared/pkg/openapi/subscription/v1
        --package subscription_v1
        --clean
        {{.OPEN_API_SUBSCRIPTION_V1_BUNDLE}}

  # ──────────────────────────────────────────────
  # ОСНОВНЫЕ КОМАНДЫ
  # ──────────────────────────────────────────────

  gen:
    desc: "Генерация всех proto и OpenAPI деклараций"
    cmds:
      - task: proto:gen
      - task: ogen:gen

  format:
    desc: "Форматирует код gofumpt + gci"
    deps: [ install-formatters ]
    cmds:
      - >-
        {{.GOFUMPT}} -extra -w
        subscription payment catalog shared

  lint:
    desc: "Линтер для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run subscription/... --config=.golangci.yml'
      - '{{.GOLANGCI_LINT}} run payment/... --config=.golangci.yml'
      - '{{.GOLANGCI_LINT}} run catalog/... --config=.golangci.yml'

  build:
    desc: "Сборка всех сервисов"
    cmds:
      - task: build:subscription
      - task: build:payment
      - task: build:catalog

  build:subscription:
    desc: "Сборка Subscription Service"
    dir: subscription
    cmds:
      - go build ./cmd/...

  build:payment:
    desc: "Сборка Payment Service"
    dir: payment
    cmds:
      - go build ./cmd/...

  build:catalog:
    desc: "Сборка Catalog Service"
    dir: catalog
    cmds:
      - go build ./cmd/...

  tidy:
    desc: "Синхронизация зависимостей"
    cmds:
      - go work sync
      - cmd: cd shared && go mod tidy -compat=1.25
      - cmd: cd subscription && go mod tidy -compat=1.25
      - cmd: cd payment && go mod tidy -compat=1.25
      - cmd: cd catalog && go mod tidy -compat=1.25

  mockery:install:
    desc: "Устанавливает mockery в ./bin"
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          echo '📦 Installing mockery...'
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}

  mockery:gen:
    desc: "Генерирует моки интерфейсов с помощью mockery"
    deps: [ mockery:install ]
    cmds:
      - |
        echo '🧪 Генерация моков...'
        {{.MOCKERY}}

  test-coverage:
    desc: "Тесты с покрытием бизнес-логики (service/repository), отчёт по каждому модулю + общий"
    cmds:
      - |
        echo "🧪 Запускаем расчёт покрытия..."
        rm -rf {{.COVERAGE_DIR}}
        mkdir -p {{.COVERAGE_DIR}}

        ERR=0
        for mod in {{.MODULES}}; do
          echo "📦 Обрабатываем модуль: $mod"

          TARGET_PKGS=$(go list ./$mod/... \
            | grep -E '/(internal/(service|repository))' \
            | grep -vE '/(mocks|testdata|pkg|api|proto|pb|cmd)' \
            | paste -sd "," -)

          if [ -z "$TARGET_PKGS" ]; then
            echo "⚠️  Нет подходящих пакетов в $mod"
            continue
          fi

          go test -coverpkg="$TARGET_PKGS" \
            -coverprofile={{.COVERAGE_DIR}}/$mod.out \
            -covermode=atomic \
            $(echo "$TARGET_PKGS" | tr "," " ") || ERR=1
        done

        if [ $ERR -ne 0 ]; then
          echo "❌ Ошибки во время тестов"
          exit $ERR
        fi

        echo
        echo "📊 Покрытие по каждому модулю:"
        for mod in {{.MODULES}}; do
          OUTFILE="{{.COVERAGE_DIR}}/$mod.out"
          if [ -f "$OUTFILE" ]; then
            printf " • %s: " "$mod"
            go tool cover -func="$OUTFILE" | tail -n1
          fi
        done

        echo
        echo "📦 Склеиваем все покрытия..."
        {
          echo "mode: atomic"
          find {{.COVERAGE_DIR}} -type f -name '*.out' ! -name '{{.COVERAGE_FILE}}' \
            -exec grep -h -v "^mode:" {} +
        } > {{.COVERAGE_DIR}}/{{.COVERAGE_FILE}}

        echo
        echo "🧾 Общее покрытие по всем модулям:"
        go tool cover -func={{.COVERAGE_DIR}}/{{.COVERAGE_FILE}} | tail -n1

  coverage:html:
    desc: "Генерирует HTML-отчёт покрытия и открывает его в браузере"
    deps: [ test-coverage ]
    cmds:
      - |
        OUTPUT={{.COVERAGE_DIR}}/coverage.html
        echo "🌐 Генерируем HTML-отчёт..."
        go tool cover -html={{.COVERAGE_DIR}}/{{.COVERAGE_FILE}} -o $OUTPUT

        echo "🚀 Открываем $OUTPUT"
        if command -v open &> /dev/null; then
          open $OUTPUT  # macOS
        elif command -v xdg-open &> /dev/null; then
          xdg-open $OUTPUT  # Linux
        else
          echo "📂 Отчёт сохранён в $OUTPUT (открой вручную)"
        fi

  test:
    desc: "Запускает юнит-тесты для всех модулей"
    summary: |
      Запускает юнит-тесты для указанных модулей проекта.
      Можно указать конкретные модули через переменную MODULES.
    cmds:
      - |
        ERR=0
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🧪 Тестируем модуль $mod"
            go test -v ./$mod/... || ERR=1
          fi
        done
        exit $ERR

  migrate:
    desc: "Запустить миграции subscription сервиса"
    dir: subscription
    cmds:
      - go run ./internal/migrator up

  migrate:down:
    desc: "Откатить последнюю миграцию"
    dir: subscription
    cmds:
      - go run ./internal/migrator down

  migrate:status:
    desc: "Статус миграций"
    dir: subscription
    cmds:
      - go run ./internal/migrator status

  migrate:reset:
    desc: "Откатить все миграции"
    dir: subscription
    cmds:
      - go run ./internal/migrator reset

  up-core:
    desc: Поднять core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🚀 Поднимаем core контейнеры"
      - docker compose up --build --detach

  down-core:
    desc: Остановить и удалить core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🛑 Останавливаем core контейнеры"
      - docker compose down --volumes

  up-catalog:
    desc: Поднять Catalog сервис и все его зависимости
    dir: deploy/compose/catalog
    cmds:
      - echo "[task] 📦 Поднимаем Catalog с зависимостями"
      - docker compose up --build --detach

  down-catalog:
    desc: Остановить и удалить Catalog сервис и все его зависимости
    dir: deploy/compose/catalog
    cmds:
      - echo "[task] 🛑 Останавливаем Catalog с зависимостями"
      - docker compose down --volumes

  up-subscription:
    desc: Поднять Subscription сервис и все его зависимости
    dir: deploy/compose/subscription
    cmds:
      - echo "[task] 📦 Поднимаем Subscription с зависимостями"
      - docker compose up --build --detach

  down-subscription:
    desc: Остановить и удалить Subscription сервис и все его зависимости
    dir: deploy/compose/subscription
    cmds:
      - echo "[task] 🛑 Останавливаем Subscription с зависимостями"
      - docker compose down --volumes

  up-payment:
    desc: Поднять Payment сервис и все его зависимости
    dir: deploy/compose/payment
    cmds:
      - echo "[task] 📦 Поднимаем Payment с зависимостями"
      - docker compose up --build --detach

  down-payment:
    desc: Остановить и удалить Payment сервис и все его зависимости
    dir: deploy/compose/payment
    cmds:
      - echo "[task] 🛑 Останавливаем Payment с зависимостями"
      - docker compose down --volumes

  up-all:
    desc: Поднять все сервисы по очереди вместе с зависимостями
    cmds:
      - task up-core
      - task up-catalog
      - task up-subscription
      - task up-payment

  down-all:
    desc: Остановить и удалить все сервисы по очереди вместе с зависимостями
    cmds:
      - task down-core
      - task down-catalog
      - task down-subscription
      - task down-payment

  test:catalog:genres:
    desc: "📚 Тест: Получить список жанров"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🎬 Получение списка жанров..."
        {{.GRPCURL}} -plaintext -d '{}' {{.GRPC_SERVER_ADDR}} catalog.v1.CatalogService/GetGenres

  test:catalog:movies:
    desc: "🎥 Тест: Получить список фильмов"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🎬 Получение списка фильмов..."
        {{.GRPCURL}} -plaintext -d '{"page": 1, "page_size": 10}' {{.GRPC_SERVER_ADDR}} catalog.v1.CatalogService/GetMovies

  test:catalog:add-movie:
    desc: "➕ Тест: Добавить фильм"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🎬 Добавление тестового фильма..."
        {{.GRPCURL}} -plaintext -d '{
          "imdb_id": "tt_test_001",
          "title": "Test Movie для CI",
          "poster_path": "https://example.com/poster.jpg",
          "youtube_id": "dQw4w9WgXcQ",
          "genre": [{"genre_id": 1, "genre_name": "Action"}],
          "ranking": {"ranking_value": 5, "ranking_name": "Excellent"}
        }' {{.GRPC_SERVER_ADDR}} catalog.v1.CatalogService/AddMovie

  test:catalog:get-movie:
    desc: "🔍 Тест: Получить фильм по imdb_id"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🎬 Получение фильма по imdb_id..."
        {{.GRPCURL}} -plaintext -d '{"imdb_id": "tt_test_001"}' {{.GRPC_SERVER_ADDR}} catalog.v1.CatalogService/GetMovieById

    # Добавляй остальные тесты по аналогии...

  test-api:
    desc: "🧪 Полный тест API (ожидается, что сервисы запущены локально)"
    deps: [ grpcurl:install ]
    cmds:
      - |
        echo "🚀 Запуск тестов API (локальный режим)..."
        echo "⚠️  Убедись, что Catalog сервис запущен локально (go run ./cmd/server)"
        
        # Небольшая пауза на Windows
        powershell -Command "Start-Sleep -Seconds 3" || timeout /t 3 /nobreak >nul
        
        ERRORS=0
        
        echo "═══════════════════════════════════════"
        echo "📚 CATALOG SERVICE (локально)"
        echo "═══════════════════════════════════════"
        
        task test:catalog:genres || ERRORS=$((ERRORS+1))
        task test:catalog:movies || ERRORS=$((ERRORS+1))
        task test:catalog:add-movie || ERRORS=$((ERRORS+1))
        task test:catalog:get-movie || ERRORS=$((ERRORS+1))
        
        echo "═══════════════════════════════════════"
        if [ $ERRORS -eq 0 ]; then
          echo "🎉 Все тесты успешно пройдены!"
        else
          echo "💥 Провалено тестов: $ERRORS"
          exit 1
        fi
        echo "═══════════════════════════════════════"